title: 'CompTIA AutoOps+ (AT0-001) Course Notes'
description: >-
  Open, two-column course notes for the new CompTIA AutoOps+ exam, one exam
  objective at a time across all four domains: automation coding, system
  configuration, continuous integration, and continuous delivery. 103 pages,
  35 topics, with hand-drawn figures, "On the exam" tips, and hands-on "Try it"
  exercises. Every command and line of terminal output in the notes came from a
  real run, and the source repository keeps a test script per topic so the
  examples can be rechecked when tools change. Download the complete book or a
  single domain. CC BY-NC-SA 4.0.
