title: 'CompTIA SecAI+ (CY0-001) Course Notes'
description: >-
  Open, two-column course notes for CompTIA SecAI+, one exam objective at a
  time across all four domains: AI concepts for cybersecurity, securing AI
  systems, AI-assisted security, and AI governance, risk, and compliance.
  89 pages, 31 topics, with hand-drawn figures, "On the exam" tips, and
  hands-on "Try it" exercises. The prompt injection, guardrail, and RAG
  examples show real output from small open models running locally, with no
  API keys, and the source repository keeps a test script per topic that
  reruns them. Download the complete book or a single domain. CC BY-NC-SA 4.0.
