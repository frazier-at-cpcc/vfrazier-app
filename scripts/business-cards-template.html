<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Business cards — Avery 28878</title>
<style>
  /* Inter Variable, self-hosted via @fontsource (same font the site ships). */
  @font-face {
    font-family: 'Inter Variable';
    font-style: normal;
    font-display: block;
    font-weight: 100 900;
    src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
  }

  :root {
    /* Palette mirrors src/styles/tokens.css */
    --ink: #1a1209;
    --ink-2: #2a1d10;
    --muted: #5c4a30;
    --page: #ebe9e6;
    --card: #ffffff;
    --accent: #6d28d9;
    --accent-light: #c4b3ff;
    --accent-deep: #3a1d70;
    --highlight: #ffd60a;
  }

  @page { size: 8.5in 11in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Inter Variable', system-ui, sans-serif;
    background: #fff;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /*
   * Avery 28878 (Clean Edge business cards): US Letter, 10 cards of
   * 3.5in x 2in in 2 columns x 5 rows. Margins: 0.5in top/bottom,
   * 0.75in left/right. Cards butt together — no gutters — so per-card
   * backgrounds meet edge-to-edge and act as their own bleed.
   */
  .sheet {
    width: 8.5in;
    height: 11in;
    padding: 0.5in 0.75in;
    break-after: page;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 3.5in);
    grid-auto-rows: 2in;
  }
  /*
   * 1/16in pseudo-bleed: extends the sheet color past the outer card edges so
   * slight printer misalignment can't leave white slivers. The padding and
   * negative margin cancel, so card positions stay exactly on the Avery grid.
   */
  .bleed {
    padding: 0.0625in;
    margin: -0.0625in;
  }
  .bleed.stone { background: var(--page); }
  .bleed.purple { background: var(--accent); }
  .card {
    position: relative;
    width: 3.5in;
    height: 2in;
    overflow: hidden;
  }

  /* ---------- Front: stone page + framed white card ---------- */
  .front { background: var(--page); }
  .frame {
    position: absolute;
    inset: 0.11in;
    /* Keep the solid shadow inside the trim: pull the frame off the cut line. */
    right: 0.14in;
    bottom: 0.14in;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 6px;
    box-shadow: 3.5px 3.5px 0 var(--ink);
    padding: 0.115in 0.135in 0.12in;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .frame::before {
    content: '';
    position: absolute;
    top: -0.28in;
    right: -0.22in;
    width: 0.62in;
    height: 0.62in;
    background: var(--highlight);
    border-radius: 50%;
    opacity: 0.55;
  }
  .frame::after {
    content: '';
    position: absolute;
    bottom: -0.24in;
    left: 0.55in;
    width: 0.5in;
    height: 0.5in;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.12;
  }
  .eyebrow {
    position: relative;
    z-index: 1;
    align-self: flex-start;
    background: var(--ink);
    color: var(--page);
    font-size: 4.7pt;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    padding: 2.4pt 5pt;
    border-radius: 3pt;
  }
  .name {
    position: relative;
    z-index: 1;
    font-size: 13.5pt;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-top: 5.5pt;
  }
  .name .hl {
    background: var(--highlight);
    padding: 0 3pt 1pt;
  }
  .role {
    position: relative;
    z-index: 1;
    font-size: 6pt;
    font-weight: 650;
    color: var(--ink-2);
    margin-top: 4.5pt;
    letter-spacing: 0.01em;
  }
  .dept {
    position: relative;
    z-index: 1;
    font-size: 5.6pt;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 1.5pt;
  }
  .frame .spacer { flex: 1; }
  .contact {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6pt;
  }
  .domain {
    display: inline-flex;
    align-items: center;
    background: var(--accent);
    color: var(--page);
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: -0.01em;
    padding: 2.6pt 6.5pt;
    border-radius: 99px;
  }
  .domain::before {
    content: '';
    width: 3.2pt;
    height: 3.2pt;
    background: var(--highlight);
    border-radius: 50%;
    margin-right: 3.6pt;
  }
  .email {
    font-size: 6.2pt;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  /* ---------- Back: full-purple card with centered wordmark ---------- */
  .back {
    background: var(--accent);
    color: var(--page);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back::before {
    content: '';
    position: absolute;
    top: -0.55in;
    left: -0.45in;
    width: 1.5in;
    height: 1.5in;
    background: var(--accent-deep);
    border-radius: 50%;
    opacity: 0.45;
  }
  .back::after {
    content: '';
    position: absolute;
    bottom: -0.5in;
    right: -0.35in;
    width: 1.2in;
    height: 1.2in;
    background: var(--accent-deep);
    border-radius: 50%;
    opacity: 0.45;
  }
  .back .stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .stamp {
    background: var(--highlight);
    color: var(--ink);
    border: 1.6px solid var(--ink);
    border-radius: 5pt;
    padding: 2.6pt 6pt;
    font-size: 5pt;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transform: rotate(-2.5deg);
    box-shadow: 2.5px 2.5px 0 var(--ink);
    margin-bottom: 9pt;
  }
  .wordmark {
    font-size: 17pt;
    font-weight: 800;
    letter-spacing: -0.025em;
    display: inline-flex;
    align-items: center;
  }
  .wordmark::before {
    content: '';
    width: 6.5pt;
    height: 6.5pt;
    background: var(--highlight);
    border-radius: 50%;
    margin-right: 5.5pt;
  }
  .identities {
    font-size: 5.2pt;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-light);
    margin-top: 6.5pt;
  }
</style>
</head>
<body>
  <!-- Sheet 1: fronts -->
  <section class="sheet"><div class="bleed stone"><div class="grid" id="fronts"></div></div></section>
  <!-- Sheet 2: backs (all cards identical, so duplex column-flip is safe) -->
  <section class="sheet"><div class="bleed purple"><div class="grid" id="backs"></div></div></section>

  <template id="front-card">
    <div class="card front">
      <div class="frame">
        <span class="eyebrow">AI &amp; IT Educator&ensp;&middot;&ensp;NSF Co-PI</span>
        <div class="name">Dr. <span class="hl">Frazier A. Smith</span></div>
        <div class="role">Speaker &middot; Writer &middot; Researcher</div>
        <div class="dept">Department Chair, Network Management, Cybersecurity,<br />and Cloud &amp; Virtualization &middot; Central Piedmont Community College</div>
        <div class="spacer"></div>
        <div class="contact">
          <span class="domain">vfrazier.app</span>
          <span class="email">frazier@vfrazier.app</span>
        </div>
      </div>
    </div>
  </template>

  <template id="back-card">
    <div class="card back">
      <div class="stack">
        <span class="stamp">AI &times; Entry-Level Workforce</span>
        <span class="wordmark">vfrazier.app</span>
        <span class="identities">Speaking &middot; Writing &middot; Teaching &middot; Research</span>
      </div>
    </div>
  </template>

  <script>
    // Stamp 10 copies of each card into its sheet (2 cols x 5 rows).
    for (const [tplId, gridId] of [['front-card', 'fronts'], ['back-card', 'backs']]) {
      const tpl = document.getElementById(tplId);
      const grid = document.getElementById(gridId);
      for (let i = 0; i < 10; i++) grid.appendChild(tpl.content.cloneNode(true));
    }
  </script>
</body>
</html>
