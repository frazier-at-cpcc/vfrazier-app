<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* Fonts load from node_modules so the render works offline. */
  @font-face {
    font-family: 'Inter Variable';
    font-weight: 100 900;
    src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
  }
  @font-face {
    font-family: 'Archivo Variable';
    font-weight: 100 900;
    font-stretch: 62% 125%;
    src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2-variations');
  }
  :root {
    --ink: #15110d; --paper: #f6f1e8; --violet: #5b21b6; --sun: #ffd60a;
    --coral: #ff7a59; --teal: #3ccfa9; --ink-2: #3a2f24; --footer-text: #e3dacb;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; font-family: 'Inter Variable', system-ui, sans-serif; background: var(--paper); color: var(--ink); }
  .card {
    width: 1200px;
    height: 630px;
    display: grid;
    grid-template-columns: 1fr 470px;
    position: relative;
    overflow: hidden;
  }
  .stripe {
    position: absolute;
    inset: 0 0 auto 0;
    height: 12px;
    z-index: 2;
    background: linear-gradient(90deg, var(--violet) 0 25%, var(--sun) 25% 50%, var(--coral) 50% 75%, var(--teal) 75% 100%);
  }
  .text { padding: 70px 50px 60px 70px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow {
    display: inline-block;
    background: var(--ink);
    color: var(--paper);
    padding: 9px 14px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    align-self: flex-start;
    margin-bottom: 30px;
  }
  h1 {
    font-family: 'Archivo Variable', sans-serif;
    font-stretch: 112%;
    font-size: 78px;
    line-height: 0.98;
    font-weight: 900;
    letter-spacing: -0.025em;
    margin-bottom: 28px;
  }
  h1 .hl {
    display: inline-block;
    background: var(--violet);
    color: #fff;
    padding: 0 14px 4px;
    margin-top: 10px;
  }
  .lede {
    font-size: 24px;
    line-height: 1.35;
    font-weight: 600;
    color: var(--ink-2);
    margin-bottom: 30px;
  }
  .domain {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Archivo Variable', sans-serif;
    font-stretch: 118%;
    font-size: 26px;
    font-weight: 850;
    align-self: flex-start;
  }
  .mark { display: inline-grid; grid-template-columns: 1fr 1fr; width: 30px; height: 30px; }
  .mark span:nth-child(1) { background: var(--violet); }
  .mark span:nth-child(2) { background: var(--sun); }
  .mark span:nth-child(3) { background: var(--coral); border-radius: 0 0 0 100%; }
  .mark span:nth-child(4) { background: var(--teal); }

  .field { background: var(--sun); display: flex; align-items: flex-end; padding-left: 36px; }
  .collage { display: grid; grid-template-columns: 300px 100px; grid-template-rows: repeat(3, 150px) auto; }
  .photo { grid-area: 1 / 1 / 4 / 2; }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .shape { position: relative; overflow: hidden; }
  .shape::before { content: ''; position: absolute; }
  .s1 { background: var(--coral); }
  .s1::before { inset: 0; background: var(--paper); border-radius: 0 0 0 100%; }
  .s2 { background: var(--teal); }
  .s2::before { left: 0; right: 0; bottom: 0; height: 50%; background: var(--paper); border-radius: 999px 999px 0 0; }
  .s3 { background: var(--violet); }
  .s3::before { width: 62px; height: 62px; top: 44px; left: 19px; background: var(--sun); border-radius: 50%; }
  .focus {
    grid-column: 1 / -1;
    background: var(--ink);
    color: var(--paper);
    padding: 14px 18px 16px;
    font-family: 'Archivo Variable', sans-serif;
    font-stretch: 112%;
    font-weight: 800;
    font-size: 20px;
    line-height: 1.2;
  }
  .focus .top {
    display: block;
    font-family: 'Inter Variable', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--sun);
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stripe"></div>
    <div class="text">
      <span class="eyebrow">Dept Chair · NSF Co-PI · ex-VMware</span>
      <h1>From music<br/>classroom to<br/><span class="hl">AI lab.</span></h1>
      <p class="lede">AI &amp; IT educator. Learning design leader. Speaker on the things in between.</p>
      <span class="domain"><span class="mark"><span></span><span></span><span></span><span></span></span>vfrazier.app</span>
    </div>
    <div class="field">
      <div class="collage">
        <div class="photo"><img src="../src/assets/headshot.jpg" alt="Dr. Frazier A. Smith" /></div>
        <span class="shape s1"></span>
        <span class="shape s2"></span>
        <span class="shape s3"></span>
        <div class="focus"><span class="top">Research focus</span>AI × Entry-Level Workforce</div>
      </div>
    </div>
  </div>
</body>
</html>
